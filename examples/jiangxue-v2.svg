<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" font-family="'Kaiti SC','STKaiti','KaiTi',serif" fill="#1a1a1a">
  <rect width="900" height="1200" fill="#fbfcfe"/>
  <!-- 底晕：雪 -->
  <text x="560" y="1020" font-size="420" fill="#c9d6e0" opacity="0.05">雪</text>

  <!-- 远山：小、淡、后排 -->
  <g fill="#b9c3cb">
    <text x="336" y="292" font-size="40" opacity="0.45">山</text>
    <text x="396" y="272" font-size="46" opacity="0.5">山</text>
    <text x="470" y="258" font-size="52" opacity="0.5">山</text>
    <text x="546" y="276" font-size="44" opacity="0.45">山</text>
    <text x="614" y="296" font-size="38" opacity="0.4">山</text>
    <text x="700" y="314" font-size="34" opacity="0.35">山</text>
  </g>

  <!-- 千山：主山脊，字号递减排成峰 -->
  <text x="132" y="252" font-size="122">千</text>
  <text x="200" y="336" font-size="78">山</text>
  <text x="296" y="304" font-size="104">山</text>
  <text x="410" y="338" font-size="86">山</text>
  <text x="512" y="374" font-size="68">山</text>
  <text x="596" y="404" font-size="54">山</text>

  <!-- 鸟飞绝：飞向右上角，越远越淡 -->
  <text x="654" y="252" font-size="26" opacity="0.5">鸟</text>
  <text x="678" y="230" font-size="20" opacity="0.38">鸟</text>
  <text x="712" y="206" font-size="44">鸟</text>
  <text x="758" y="172" font-size="40" transform="rotate(-18 758 172)">飞</text>
  <text x="798" y="142" font-size="26" opacity="0.45">绝</text>

  <!-- 万径：一路斜落 -->
  <text x="158" y="566" font-size="62">万</text>
  <g fill="#5a6a75">
    <text x="236" y="604" font-size="46" opacity="0.85">径</text>
    <text x="300" y="648" font-size="44" opacity="0.75">径</text>
    <text x="362" y="692" font-size="42" opacity="0.65">径</text>
  </g>

  <!-- 人踪灭：淡在雪里 -->
  <g fill="#6e7b85">
    <text x="628" y="562" font-size="44" opacity="0.6">人</text>
    <text x="688" y="602" font-size="40" opacity="0.5">踪</text>
    <text x="742" y="646" font-size="34" opacity="0.4">灭</text>
  </g>

  <!-- 寒江：横向字带，中间留缺口给钓线 -->
  <g fill="#7d93a6">
    <text x="66" y="888" font-size="50" opacity="0.75">江</text>
    <text x="156" y="906" font-size="44" opacity="0.55">江</text>
    <text x="246" y="888" font-size="46" opacity="0.7">江</text>
    <text x="556" y="906" font-size="44" opacity="0.55">江</text>
    <text x="644" y="888" font-size="46" opacity="0.7">江</text>
    <text x="732" y="906" font-size="44" opacity="0.55">江</text>
    <text x="816" y="888" font-size="42" opacity="0.5">江</text>
  </g>

  <!-- 孤舟蓑笠翁：全图唯一点景，小 -->
  <text x="280" y="840" font-size="44" transform="rotate(-16 280 840)">孤</text>
  <text x="332" y="826" font-size="48">舟</text>
  <text x="384" y="840" font-size="40" transform="rotate(14 384 840)">舟</text>
  <text x="306" y="788" font-size="28" opacity="0.9">蓑</text>
  <text x="344" y="776" font-size="30" opacity="0.9">笠</text>
  <text x="330" y="736" font-size="38">翁</text>

  <!-- 独钓寒江雪：一根垂线直入江心 -->
  <text x="462" y="700" font-size="40">独</text>
  <text x="462" y="758" font-size="40">钓</text>
  <text x="462" y="816" font-size="40">寒</text>
  <text x="462" y="874" font-size="40">江</text>
  <text x="458" y="944" font-size="46">雪</text>

  <!-- 雪：淡蓝散点，疏密不匀 -->
  <g fill="#c9d6e0">
    <text x="196" y="472" font-size="22" opacity="0.55">雪</text>
    <text x="322" y="522" font-size="18" opacity="0.45">雪</text>
    <text x="522" y="470" font-size="20" opacity="0.45">雪</text>
    <text x="626" y="470" font-size="22" opacity="0.5">雪</text>
    <text x="722" y="502" font-size="18" opacity="0.4">雪</text>
    <text x="158" y="652" font-size="20" opacity="0.45">雪</text>
    <text x="562" y="652" font-size="18" opacity="0.4">雪</text>
    <text x="782" y="722" font-size="20" opacity="0.45">雪</text>
    <text x="118" y="760" font-size="18" opacity="0.4">雪</text>
    <text x="662" y="782" font-size="16" opacity="0.35">雪</text>
    <text x="842" y="822" font-size="18" opacity="0.4">雪</text>
    <text x="238" y="1000" font-size="20" opacity="0.45">雪</text>
    <text x="398" y="1032" font-size="18" opacity="0.4">雪</text>
    <text x="598" y="1012" font-size="20" opacity="0.45">雪</text>
    <text x="758" y="1042" font-size="18" opacity="0.4">雪</text>
    <text x="518" y="1082" font-size="16" opacity="0.3">雪</text>
    <text x="298" y="1102" font-size="18" opacity="0.35">雪</text>
    <text x="700" y="1122" font-size="16" opacity="0.3">雪</text>
  </g>
</svg>
